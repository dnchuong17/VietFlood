version: '3.8'

services:
  api-gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: nguyenchuong1712/vietflood-api-gateway:latest
    container_name: vietflood-api-gateway
    ports:
      - "80:8081"
    expose:
      - "8081"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 8081
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      QDRANT_URL: ${QDRANT_URL:-https://qdrant.ndtd.indevs.in:443}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-flood_kb_staging_2026_01}
      QDRANT_CHAT_COLLECTION: ${QDRANT_CHAT_COLLECTION:-flood_kb_active}
      RAG_SERVICE_URL: ${RAG_DOCKER_SERVICE_URL:-http://rag-retrieval:8001}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TEXT_FIELD: ${QDRANT_TEXT_FIELD:-text}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b-q4_K_M}
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-120000}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      RAG_REQUEST_TIMEOUT_MS: ${RAG_REQUEST_TIMEOUT_MS:-300000}
      RAG_RETRIEVAL_TIMEOUT_MS: ${RAG_RETRIEVAL_TIMEOUT_MS:-90000}
      CHAT_KEYRING_B64: ${CHAT_KEYRING_B64}
      CHAT_KEY_CURRENT: ${CHAT_KEY_CURRENT}
      CHAT_DB_CA_BASE64: ${CHAT_DB_CA_BASE64}
      CHAT_HISTORY_ENABLED: ${CHAT_HISTORY_ENABLED:-true}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      auth-service:
        condition: service_started
      reports-service:
        condition: service_started
    restart: unless-stopped


  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$OLLAMA_CHAT_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  rag-retrieval:
    image: ${RAG_SERVICE_IMAGE:-vietflood-retrieval:local}
    environment:
      QDRANT_URL: ${QDRANT_URL:-https://qdrant.ndtd.indevs.in:443}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_CHAT_COLLECTION: ${QDRANT_CHAT_COLLECTION:-flood_kb_active}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN}
      RAG_DATA_DIR: /app/data
      HF_HOME: /models/huggingface
      FASTEMBED_CACHE_PATH: /models/fastembed
    expose:
      - "8001"
    volumes:
      - ${RAG_CORPUS_DIR:-./rag-data}:/app/data:ro
      - rag_model_cache:/models
    restart: unless-stopped

  auth-service:
    image: nguyenchuong1712/vietflood-auth-service:latest
    container_name: vietflood-auth-service
    expose:
      - "1712"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  reports-service:
    image: nguyenchuong1712/vietflood-reports-service:latest
    container_name: vietflood-reports-service
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vietflood-redis
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vietflood-rabbitmq
    expose:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    restart: unless-stopped

volumes:
  ollama_models:
  rag_model_cache:
